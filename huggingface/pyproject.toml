[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "stabilityarc"
version = "0.1.0"
description = "StabilityArc sequence inference"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.7,<2.8",
    "esm>=3.1.0",
]

[tool.setuptools]
packages = ["stabilityarc"]